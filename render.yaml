databases:
  - name: alphaquantx-db
    plan: free
    region: singapore   # Oregon é bloqueado pela Binance (HTTP 451) — usar Singapore

services:
  - type: web
    name: alphaquantx-api
    runtime: python
    region: singapore
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_MODE
        value: "true"   # trocar para "false" apenas após critérios da seção 53
      - key: DATABASE_URL
        fromDatabase:
          name: alphaquantx-db
          property: connectionString
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_FUTURE_CHAT_ID
        sync: false
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: worker
    name: alphaquantx-scanner-worker
    runtime: python
    region: singapore
    # Render does not offer Free instances for persistent workers.
    plan: starter
    rootDir: worker
    buildCommand: pip install -r requirements.txt
    startCommand: python app/main.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_MODE
        value: "true"
      - key: SCAN_ASSETS
        value: "BTCUSDT,ETHUSDT"
      - key: SCAN_TIMEFRAMES
        value: "15m,1h,4h"
      - key: DATABASE_URL
        fromDatabase:
          name: alphaquantx-db
          property: connectionString
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_FUTURE_CHAT_ID
        sync: false
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  # Fase 12 — Analytics: resumo diário e relatório semanal via Telegram
  - type: cron
    name: alphaquantx-daily-summary
    runtime: python
    region: singapore
    # Render does not offer Free instances for cron jobs.
    plan: starter
    rootDir: worker
    schedule: "0 23 * * *"  # 23:00 UTC todo dia
    buildCommand: pip install -r requirements.txt
    startCommand: python app/cron_daily_summary.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: alphaquantx-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_FUTURE_CHAT_ID
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: cron
    name: alphaquantx-weekly-report
    runtime: python
    region: singapore
    # Render does not offer Free instances for cron jobs.
    plan: starter
    rootDir: worker
    schedule: "0 23 * * 0"  # domingo às 23:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python app/cron_weekly_report.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: alphaquantx-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_FUTURE_CHAT_ID
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false

  # Fase 13 — Backtest: valida os playbooks contra o histórico já coletado
  - type: cron
    name: alphaquantx-backtest
    runtime: python
    region: singapore
    # Render does not offer Free instances for cron jobs.
    plan: starter
    rootDir: worker
    schedule: "0 6 * * 1"  # segunda-feira às 06:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python app/cron_backtest.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_MODE
        value: "true"
      - key: SCAN_ASSETS
        value: "BTCUSDT,ETHUSDT"
      - key: SCAN_TIMEFRAMES
        value: "15m,1h,4h"
      - key: DATABASE_URL
        fromDatabase:
          name: alphaquantx-db
          property: connectionString
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_FUTURE_CHAT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
