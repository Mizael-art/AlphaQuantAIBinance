# render.yaml
# ============
# Blueprint para deploy automático no Render.
#
# O AlphaQuant X roda como um único Web Service com APScheduler interno
# que executa o ciclo autônomo a cada 15 minutos. O Cron Job separado
# foi removido — o scheduler interno é mais confiável e evita custo extra.
#
# IMPORTANTE: O Render Free Tier hiberna após 15 min sem requests.
# Use UptimeRobot (ou similar) pingando GET /health a cada 5 min para
# manter o serviço ativo. Isso é um workaround — não é garantia de 24/7.
# Para confiabilidade real, use o plano Starter ($7/mês).

services:
  - type: web
    name: alphaquant-engine
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEBUG_MODE
        value: "false"
      # Database — sem DATABASE_URL, cai para SQLite local (dados efêmeros no free tier)
      - key: DATABASE_URL
        fromDatabase:
          name: alphaquant-db
          property: connectionString
      # Autonomous Engine
      - key: AUTONOMOUS_ENGINE_ENABLED
        value: "true"
      - key: SCAN_INTERVAL_MINUTES
        value: "15"
      # Telegram — preencher com dados do @BotFather
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # Não committar secrets — configurar via dashboard do Render
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_COOLDOWN_HOURS
        value: "4"
      # Cache
      - key: KLINE_CACHE_TTL_SECONDS
        value: "180"

databases:
  - name: alphaquant-db
    plan: free
    databaseName: alphaquant
    user: alphaquant
