databases:
  - name: alphaquantx-db
    plan: free
    region: singapore   # Singapore evita bloqueios da Binance

services:
  - type: web
    name: alphaquantx-api
    runtime: python
    region: singapore
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_MODE
        value: "true"   # trocar para "false" após validar alertas no Telegram
      - key: SCAN_ASSETS
        value: "BTCUSDT,ETHUSDT"
      - key: SCAN_TIMEFRAMES
        value: "15m,1h,4h"
      - key: DATABASE_URL
        fromDatabase:
          name: alphaquantx-db
          property: connectionString
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_FUTURE_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
